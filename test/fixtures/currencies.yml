# The currencies this installation supports. Kept in step with the SEED in
# config/initializers/currency.rb — CurrencyConfig::SYMBOLS.
#
# ⚠️ Present so the tests exercise the TABLE, which is the real path in
# production. Without them the table is empty and every test silently runs on
# CurrencyConfig's fallback constant instead — passing while proving nothing
# about the thing that actually ships. `currency_config_test.rb` covers the
# fallback deliberately and separately.
gbp:
  code: GBP
  symbol: "£"
  active: true

eur:
  code: EUR
  symbol: "€"
  active: true

usd:
  code: USD
  symbol: "$"
  active: true

chf:
  code: CHF
  symbol: "CHF "
  active: true
