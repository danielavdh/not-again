      features_heading: "Wat hij doet, met tegenzin"
      tier_admin: "admin"
      tier_sysadmin: "sysadmin"
      tier_dev: "dev"
      f1_title: "Hij houdt heel veel boeken bij"
      f1_body: "Dubbel boekhouden voor maximaal 99 bedrijven. Voor jezelf of om te delen met andere boekhouders. Rekeningen aanmaken, boeken, bonnen koppelen, rapportages inrichten."
      f2_title: "Hij laat je elke valuta toevoegen"
      f2_body: "Betaald worden in złoty, betalen met een europas, het rapport schrijven in pond. Handel je in iets obscuurs? Voeg het toe. Fluitje van een cent. Geen supportticket, geen wachten op een release. Jij voert de boeken, jij kiest de valuta's."
      f3_title: "Hij vertrouwt mensen precies zo ver als jij"
      f3_body: "Moet je accountant alles zien en niets veranderen? Natuurlijk. Je hulp die elke bon kwijtraakt: kiekje maken, uploaden, klaar. Per bedrijf."
      f4_title: "Hij weet hoe je loslaat"
      f4_body: "Geen abonnement, geen prijsverhoging, geen lock-in, geen upselling, niet in de VS."
      f5_title: "Hij is saai in elke taal"
      f5_body: "Elke pagina volledig vertaald. Al beschikbaar? Vink aan. Sla op. Nog niet? Vijf bestanden te vertalen (door jou of AI). Voeg toe. Sla op. Controleer. Publiceer."
      f6_title: "Hij haalt de koersen"
      f6_body: "Wisselkoersen die de grote Europese belastingdiensten accepteren — ECB, HMRC, ESTV, BMF? Vanzelf. Nog andere nodig? Twee yml-bestanden. Misschien één Ruby-klasse, sjabloon zit erbij. Maak jouw belastingdienst blij."
      f7_title_html: "Boekhouden,<br />geen bedrijfsvoering"
      f7_body_html: "Geen facturatie · geen offertes · geen klanten · geen leveranciers · geen betalingen · geen bankkoppelingen · geen salarisadministratie · geen voorraad · geen budgetten · geen verwarring. Alleen\u00A0boekhouden, met opzet."
      f8_title: "Helemaal de jouwe"
      f8_body_html: "Open source, AGPL-gelicentieerd, zelf te hosten, op Rails. Bekijk de code, kloon hem, draai hem, hou hem. Wil je me bedanken: host in Europa."
      band_heading_html: "Lees de code.<br>Die is interessanter dan de app."
      band_note: "in de openbaarheid gebouwd · issues en PR's welkom"
