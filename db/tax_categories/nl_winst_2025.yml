    position: 20
    keywords: [voorraad, onderhanden werk]
  - key: geactiveerde_productie_eigen_bedrijf
    label: "Geactiveerde productie eigen bedrijf fiscaal"
    export_column: "bd-i_CapitalizedProductionOwnBusinessFiscal"
    section: income
