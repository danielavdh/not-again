        - "código abierto"
      title_html: 'Contabilidad.<br><span class="again">Otra vez</span> no.'
      subline_html: "Ahora %{word} en cada idioma."
      lede_html: "Las cuentas tienen que cuadrar. En cualquier moneda. En cualquier idioma.<br>Para cualquier hacienda. Con ayuda o sin ella. Mejor ya."
