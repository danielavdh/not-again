default: &default
  dispatchers:
    - polling_interval: 15
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 5
  
  clear_finished_jobs_after: 7.days
  clear_failed_jobs_after: 30.days

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default