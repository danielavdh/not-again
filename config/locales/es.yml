      features_heading: "Lo que hace, a regañadientes"
      tier_admin: "admin"
      tier_sysadmin: "sysadmin"
      tier_dev: "dev"
      f1_title: "Lleva muchos libros"
      f1_body: "Contabilidad por partida doble para hasta 99 negocios. Para ti solo o para compartir con otros contables. Crear cuentas, asentar, vincular justificantes, configurar informes."
      f2_title: "Te deja añadir cualquier moneda"
      f2_body: "Cobrar en złoty, pagar con una tarjeta en euros, escribir el informe en libras. ¿Operas en algo poco común? Añádela. Pan comido. Sin ticket de soporte, sin esperar a una versión. Tú llevas los libros, tú eliges las monedas."
      f3_title: "Confía en la gente exactamente hasta donde tú confías"
      f3_body: "¿Quieres que tu asesoría lo vea todo y no cambie nada? Claro. Tu ayudante que pierde todos los justificantes: foto, subir, listo. Por negocio."
      f4_title: "Sabe cómo soltar"
      f4_body: "Sin suscripción, sin subidas de precio, sin ataduras, sin ventas adicionales, fuera de EE.UU."
      f5_title: "Es aburrida en todos los idiomas"
      f5_body: "Cada página, totalmente traducida. ¿Ya existe? Marca. Guarda. ¿Todavía no? Cinco archivos por traducir (por ti o por IA). Añade. Guarda. Revisa. Publica."
      f6_title: "Obtiene tipos de cambio"
      f6_body: "¿Tipos de cambio que aceptan las principales autoridades fiscales europeas — BCE, HMRC, ESTV, BMF? Por su cuenta. ¿Necesitas otros? Dos archivos yml. Quizá una clase Ruby, con plantilla incluida. Haz feliz a tu hacienda."
      f7_title_html: "Contabilidad,<br />no gestión empresarial"
      f7_body_html: "Sin facturación · sin presupuestos · sin clientes · sin proveedores · sin pagos · sin conexión bancaria · sin nóminas · sin inventario · sin\u00A0previsiones · sin confusión. Solo contabilidad, a propósito."
      f8_title: "Tuya"
      f8_body_html: "Código abierto, con licencia AGPL, autoalojable, sobre Rails.<br />Mira el código, clónalo, ejecútalo, quédatelo. Si quieres darme las gracias: alójala en Europa."
      band_heading_html: "Lee el código.<br>Es más interesante que la aplicación."
      band_note: "desarrollado en abierto · issues y PRs bienvenidos"
      band_cta: "Ver en GitHub ↗"
      footer_sig: "not-again · contabilidad, por desgracia"
      footer_docs: "docs"
