# What this scheme is CALLED, in the language of its own form — the name shown
# in the scheme picker and in every message about it. Never translated: an
# Anlage V is called Anlage V by everyone who fills one in.
scheme_label: "EÜR"
report_name: "DE-EÜR"
currency: EUR
# Anlage EÜR — Einnahmenüberschussrechnung nach § 4 Abs. 3 EStG.
#
# Transcribed box by box from the Vordruck named in `source:` below — that block
# is the record of which edition, and its checksum. The BMF publishes each year's
# Vordruck in the August or September of that year.
#
# export_column is the KENNZAHL — what ELSTER transmits, and stable from year to
# year. Zeile numbers move and live in notes.
#
# Two keys that used to be here have been removed because the boxes do not
# exist:
#   * "betriebseinnahmen_ermaessigt" (ermäßigt besteuert, 7 %). The Vordruck
#     splits income by Kleinunternehmer (111), land- und forstwirtschaftlicher
#     Durchschnittssatz (104), umsatzsteuerpflichtig (112) and steuerfrei bzw.
#     nicht steuerbar (103). 19 % and 7 % both go to Kennzahl 112.
#   * "sonstige_einnahmen". Every income box on the Vordruck is specific; there
#     is no catch-all.
# "umsatzsteuer" was one key trying to be two boxes and is now
# vereinnahmte_umsatzsteuer (140, Einnahme) and gezahlte_umsatzsteuer (186,
# Ausgabe).
#
# Not included: the Land- und Forstwirtschaft boxes (104, and the Überträge from
# Anlage LuF), the Investitionsabzugs- and Rücklagen machinery, and the
# pauschalierte Fahrten zwischen Wohnung und Betriebsstätte (142/176). Those are
# computations or regimes, not things you book to an account.
#
# One caveat on the "beschränkt abziehbar" boxes (Zeilen 62 bis 67): the form
# has two columns there, nicht abziehbar and abziehbar, and a category carries
# one figure. The Kennzahl below is the ABZIEHBARE column, so an account mapped
# to Bewirtungsaufwendungen should hold the deductible share (70 %) — or the
# split belongs in two accounts.
# No index_url: the BMF publishes each year's Vordruck at a fresh DATED url
# (2025-08-29-anlage-EUER-2025.pdf) and formulare-bfinv.de is a JavaScript app
# that cannot be read. So the file check runs and the new-year check does not —
# declared honestly rather than pointed at a page that would never fire.
# Provenance, and what TaxFormWatchJob watches monthly: it re-fetches
# `url`, compares the checksum, and looks on `index_url` for a later edition
# than `form_year`. A 404 is reported (the address moved); a timeout is not.
