# Read-only on TWO entities held by TWO DIFFERENT full-access admins (one on
# personal, two on family_biz) — the shared-accountant case: management
# follows the actual AdminEntity links, so both should be able to manage
# this admin. See Admin#shares_full_access_entity_with?.
shared_reader:
  username: shared_reader
  email_address: shared_reader@example.com
  password_digest: <%= password_digest %>
  last_seen: 2025-02-25 18:00:18
  terms_agreed_version: <%= terms_agreed_version %>
  terms_agreed_at: <%= terms_agreed_at %>
  claimed_at: <%= claimed_at %>

# Holds DIFFERENT access levels on different entities: full_access on
# family_biz(10), read_only on personal(01). The combination sudo can create by
# granting one entity to an admin who was invited as a reader on another — and
# the one that used to unlock writing everywhere. See docs/gitignored/access-model.md, F2.
