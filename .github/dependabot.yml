# Dependabot opens a pull request whenever a dependency has a newer version.
# Left at its defaults it opened one per gem per day against `main` — a branch
# no work happens on — so they piled up unread, which is worse than none: a
# genuine security bump looks exactly like the other eleven.
#
# So: monthly, and GROUPED into one PR per ecosystem. Security advisories are
# never grouped by Dependabot and still arrive on their own, which is the point.
# CI also runs `bundler-audit` on every push, so an advisory is caught there
# whether or not anyone reads a PR.
#
# A version is only proposed once it has been out for 7 days (cooldown). A
# poisoned release from a hijacked maintainer account is usually found and
# pulled within days; whoever updates at once is who installs it. Security
# updates ignore the cooldown, per GitHub's docs.
#
# Never merged from the PR page: the update is installed locally, the whole
# suite and the system tests run, and the release notes of every major jump
# (direct or not — the minor-and-patch group lets a transitive major through)
# are read before committing. The pushed lockfile then closes the PR.
version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: monthly
  cooldown:
    default-days: 7
  open-pull-requests-limit: 5
  groups:
    # Everything routine in one PR. Majors stay separate: those are the ones
    # that break things quietly — image_processing 1→2 was the example, where
    # ReceiptUploader.compress_image rescues to nil and a green suite proved
    # nothing. Taken on 2026-09-23 with a test that asserts a real thumbnail
    # comes out, not just that a key exists.
    bundler-minor-and-patch:
      patterns: [ "*" ]
      update-types: [ "minor", "patch" ]

- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: monthly
  cooldown:
    default-days: 7
  open-pull-requests-limit: 5
  groups:
    actions:
      patterns: [ "*" ]

- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: monthly
  cooldown:
    default-days: 7
  open-pull-requests-limit: 5
