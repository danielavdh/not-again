      f1_body: "Double-entry bookkeeping for up to 99 businesses. For yourself or shared with other bookkeepers. Create accounts, write entries, link receipts, set up reports."
      f2_title: "It lets you add any currency"
      f2_body: "Get paid in złoty, pay with a euro card, write the report in pound sterling. Dealing in something obscure? Add it in a minute — no support ticket, no waiting for a release. You run the books, you choose your currencies."
      f3_title: "It trusts people precisely as far as you do"
      f3_body: "You want your accountant to see everything and change nothing? Done. Your helper who loses every receipt: photo, upload, done. Per business."
