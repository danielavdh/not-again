  welcome:
    index:
      login: "anmelden"
      nav_features: "funktionen"
      nav_demo: "demo"
      eyebrow:
        - "Buchhaltung in jeder Währung"
        - "open source"
      title_html: 'Buchhaltung.<br>Nicht <span class="again">schon wieder.</span>'
      subline_html: "Jetzt in jeder Sprache %{word}."
      lede_html: "Die Zahlen müssen stimmen. In jeder Währung. In jeder Sprache.<br>Für jedes Finanzamt. Mit oder ohne Hilfe. Am besten gleich."
      cta_primary: "Brings hinter dich →"
      cta_demo: "Schau das Zeug an"
      cta_note: "kostenlos · open source · selbst hostbar"
      ledger_currencies: "Währungen"
      ledger_languages: "Sprachen"
      ledger_licence: "Lizenz"
      ledger_excitement: "Spaß"
      features_heading: "Was sie tut, widerwillig"
      tier_admin: "admin"
      tier_sysadmin: "sysadmin"
      tier_dev: "dev"
      f1_title: "Sie führt viele Bücher"
      f1_body: "Doppelte Buchführung für bis zu 99 Betriebe. Für dich allein oder zum Teilen mit anderen Buchhaltern. Konten anlegen, buchen, Belege verknüpfen, Auswertungen einrichten."
      f2_title: "Sie lässt dich jede Währung hinzufügen"
      f2_body: "Bezahlt werden in Złoty, zahlen mit einer Euro-Karte, den Bericht in Pfund schreiben. Du handelst in etwas Ausgefallenem? Fügs hinzu. Kinderspiel. — kein Support-Ticket, kein Warten auf ein Release. Du führst die Bücher, du wählst die Währungen."
      f3_title: "Sie traut Leuten genau so weit wie du"
      f3_body: "Deine Steuerberatung soll alles sehen und nichts ändern? Na klar. Der Helfer, der jeden Beleg verliert: Abknipsen, hochladen, klar. Pro Betrieb."
      f4_title: "Sie weiß, wie man loslässt."
      f4_body: "Kein Abo, keine Preiserhöhung, kein Lock-in, kein Upselling, nicht in den USA."
      f5_title: "Sie spricht jede Sprache"
      f5_body: "Jede Seite in Deiner Sprache: Verfügbar? Abhaken. Speichern. Noch nicht verfügbar? Fünf Dateien übersetzen (Du oder KI). Hinzufügen. Speichern. Prüfen. Veröffentlichen."
      f6_title: "Sie holt die Kurse"
      f6_body: "Währungskurse, die die großen europäischen Steuerbehörden akzeptieren — EZB, HMRC, ESTV, BMF? Von allein. Du brauchst noch andere? Zwei yml-Dateien. Vielleicht eine Ruby-Klasse, Vorlage liegt bei. Mach dein Finanzamt glücklich."
      f7_title_html: "Buchhaltung,<br />keine Betriebsführung"
      f7_body_html: "Keine Rechnungsstellung · keine Angebote · keine Kunden · keine Lieferanten · keine Zahlungen · keine Bankanbindung · kein Lager · keine Lohnabrechnung · keine Budgets · keine Verwirrung.<br />Nur Buchhaltung, absichtlich."
      f8_title: "Ganz die deine"
      f8_body_html: "Open Source, AGPL-lizenziert, selbst hostbar, auf Rails. Sieh dir den Code an, klone ihn, betreibe ihn, behalte ihn. Wenn du dich bedanken willst: hoste in Europa."
      band_heading_html: "Lies den Code.<br>Er ist interessanter als die App."
      band_note: "// offen entwickelt · Issues und PRs willkommen"
      band_cta: "Auf GitHub ansehen ↗"
