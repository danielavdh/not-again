  # Money RECEIVED, and an expense all the same: the return files it inside
  # Personeelskosten, where it reduces the block, and Dutch practice credits it
  # against staff costs rather than showing it as income. Booked as a credit to
  # an expense account it comes out negative and does exactly that.
