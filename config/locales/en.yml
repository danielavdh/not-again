      f4_body: "No subscription, no price rise, no lock-in, no upsell, not in the US."
      f5_title: "It's boring in every language"
      f5_body: "Every screen, fully translated. Available? Tick. Save. Not available yet? Five files to translate (by you or AI). Add. Save. Review. Publish."
      f6_title: "It gets the rates"
      f6_body: "Fetches what the major European tax authorities accept — ECB, HMRC, ESTV, BMF. By default. Need another? Two yml files. Maybe one Ruby class, template provided. Whatever it takes to please your tax office."
      f7_title_html: "Bookkeeping,<br />not business management"
      f7_body_html: "No invoicing · no quotes · no customers · no suppliers · no payments · no bank feeds · no payroll · no inventory · no budgets · no\u00A0confusion. Just the books, by design."
      f8_title: "All yours"
      f8_body_html: "Open source, AGPL-licensed, self-hostable, on Rails.<br />Inspect the code, clone it, run it, keep it. If you want to thank me: host it in Europe."
