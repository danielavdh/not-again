country_code: de
country_label: "Deutschland"
scheme: vat
tax_year: 2026
authority: ELSTER
position: 20
scheme_label: "Umsatzsteuer-Voranmeldung"
report_name: "DE-USt"
currency: EUR
form_code: UStVA
kind: vat
no_tax_label: "Keine USt"
# Zeile 49, Kz 39: a filer with a Dauerfristverlängerung pays a
# Sondervorauszahlung in advance and deducts it from Kz 83 in the last
# Voranmeldung of the year. A figure on the return, not a transaction — the
# report form asks for it, and only here, because this header names it.
prepayment_category: sondervorauszahlung
# THE SHAPE THAT DIFFERS, and the reason this file was worth writing: the UStVA
# has NO Kennzahl for output tax at 19% or 7%. You enter the net in 81 and 86
# and ELSTER computes the tax itself. The Dutch form pairs each rubriek with its
# own btw; the British form collects every output tax in box 1; Germany collects
# none at all.
#
# So the tax still has to go somewhere, because Kz 83 is computed from it. It
# goes to a category with NO export_column — a feeder, invisible on the return,
# the same device gb_vat already uses to let one code reach two boxes. Kz 83
# then includes the feeders and subtracts the Vorsteuer Kennzahlen.
#
# ⚠️ Mixing a Bemessungsgrundlage with a Steuer is, in the Germans' own words,
# "der häufigste Formularfehler überhaupt". NET: 81, 86, 46, 89, 93, 41, 43, 48,
# 60. TAX: 47, 61, 62, 66, 67. The labels below say which, every time.
#
# Deliberately NOT covered: the Land-/Forstwirtschaft rates, the Bauleistungen
# and Grundstück sub-cases of § 13b (Kz 73/74) and the Berichtigungs-Kennzahlen
# (Kz 64/65/69). A core UStVA, not a complete one.
#
# vat_accounts is left at the default (balance sheet). Umsatzsteuer and
# Vorsteuer are Bilanzkonten for a bilanzierender Unternehmer. An EÜR filer
# treats them as Betriebseinnahme/-ausgabe instead — that is a property of the
# TAXPAYER, not of the form, and this file cannot express it.

categories:
  # --- Steuerpflichtige Umsätze (Bemessungsgrundlage) ------------------------
  - key: umsatz_19
    label: "Steuerpflichtige Umsätze zum Steuersatz von 19 % — Bemessungsgrundlage"
    export_column: "81"
    position: 10
  - key: umsatz_7
    label: "Steuerpflichtige Umsätze zum Steuersatz von 7 % — Bemessungsgrundlage"
    export_column: "86"
    position: 20
  # --- Steuerfreie Umsätze (Bemessungsgrundlage) -----------------------------
  - key: ig_lieferungen
    label: "Innergemeinschaftliche Lieferungen an Abnehmer mit USt-IdNr. — Bemessungsgrundlage"
    export_column: "41"
    position: 30
  - key: steuerfrei_mit_vorsteuerabzug
    label: "Weitere steuerfreie Umsätze mit Vorsteuerabzug — Bemessungsgrundlage"
    export_column: "43"
    position: 40
  - key: steuerfrei_ohne_vorsteuerabzug
    label: "Steuerfreie Umsätze ohne Vorsteuerabzug — Bemessungsgrundlage"
    export_column: "48"
    position: 50
  # Zeile 34: as the SUPPLIER, domestic supplies for which the customer owes
  # the tax under § 13b Abs. 5 — Bauleistungen, Gebäudereinigung and the like.
  # NOT a service to a business abroad: that is Kz 21 or 45 below.
  - key: leistungen_13b_erbracht
    label: "Im Inland ausgeführte Umsätze, für die der Leistungsempfänger die Steuer schuldet (§ 13b Abs. 5) — Bemessungsgrundlage"
    export_column: "60"
    position: 60
  # Zeile 35: a service to a business in another member state, taxed there
  # (§ 3a Abs. 2, § 18b Satz 1 Nr. 2) — also reported in the ZM.
  - key: nicht_steuerbar_eu_b2b
    label: "Nicht steuerbare sonstige Leistungen gem. § 18b Satz 1 Nr. 2 UStG — Bemessungsgrundlage"
    export_column: "21"
    position: 62
  # Zeile 36: everything else with a place of supply outside Germany — a
  # service to a business outside the EU, a gig performed abroad for a
  # non-business audience, OSS turnover above the threshold.
  - key: nicht_steuerbar_uebrige
    label: "Übrige nicht steuerbare Umsätze (Leistungsort nicht im Inland) — Bemessungsgrundlage"
    export_column: "45"
    position: 64
  # Zeile 28: the other rates. Only the second half of 2020 has ever needed
  # them (16 % and 5 %), and Kz 36 IS a tax field, unlike 81/86.
  - key: umsatz_andere_saetze
    label: "Umsätze zu anderen Steuersätzen — Bemessungsgrundlage"
    export_column: "35"
    position: 25
  - key: steuer_andere_saetze
    label: "Umsätze zu anderen Steuersätzen — Steuer"
    export_column: "36"
    position: 26
  # --- Innergemeinschaftliche Erwerbe (Bemessungsgrundlage) ------------------
  - key: ig_erwerb_19
    label: "Innergemeinschaftliche Erwerbe zum Steuersatz von 19 % — Bemessungsgrundlage"
    export_column: "89"
    position: 70
  - key: ig_erwerb_7
    label: "Innergemeinschaftliche Erwerbe zum Steuersatz von 7 % — Bemessungsgrundlage"
    export_column: "93"
    position: 80
  # Zeile 26: acquisitions at other rates — the second half of 2020 — and
  # here, as in Kz 36, the tax has a field of its own.
  - key: ig_erwerb_andere_saetze
    label: "Innergemeinschaftliche Erwerbe zu anderen Steuersätzen — Bemessungsgrundlage"
    export_column: "95"
    position: 82
  - key: steuer_ig_erwerb_andere_saetze
    label: "Innergemeinschaftliche Erwerbe zu anderen Steuersätzen — Steuer"
    export_column: "98"
    position: 84
  # --- § 13b als Leistungsempfänger ------------------------------------------
  # Zeile 30 (Kz 46/47) is ONLY a service from a supplier established in
  # another member state (§ 3a Abs. 2, § 13b Abs. 1). A service from outside
  # the EU — a US host, a Swiss agent, a British label — is Zeile 32, "Andere
  # Leistungen" (Kz 84/85), with Werklieferungen and the rest of § 13b Abs. 2.
  # The Vorsteuer for both is Kz 67.
  - key: leistungen_13b_bezogen
    label: "Sonstige Leistungen eines im übrigen Gemeinschaftsgebiet ansässigen Unternehmers (§ 13b Abs. 1) — Bemessungsgrundlage"
    export_column: "46"
    position: 90
  - key: steuer_13b
    label: "Steuer auf Leistungen nach § 13b Abs. 1 — Steuer"
    export_column: "47"
    position: 100
  - key: leistungen_13b_andere
    label: "Andere Leistungen (§ 13b Abs. 2 Nr. 1, 2, 4 bis 12) — Bemessungsgrundlage"
    export_column: "84"
    position: 102
  - key: steuer_13b_andere
    label: "Steuer auf andere Leistungen nach § 13b Abs. 2 — Steuer"
    export_column: "85"
    position: 104
  # --- Vorsteuer (Steuer) ----------------------------------------------------
  - key: vorsteuer_rechnungen
    label: "Vorsteuerbeträge aus Rechnungen anderer Unternehmer — Steuer"
    export_column: "66"
    position: 110
  - key: vorsteuer_ig_erwerb
    label: "Vorsteuerbeträge aus innergemeinschaftlichen Erwerben — Steuer"
    export_column: "61"
    position: 120
  # "Entstandene", not "entrichtete": since 2020 the deduction follows the tax
  # arising (§ 15 Abs. 1 Satz 1 Nr. 2), not its payment, and the 2026 form
  # says so.
  - key: einfuhrumsatzsteuer
    label: "Entstandene Einfuhrumsatzsteuer — Steuer"
    export_column: "62"
    position: 130
  - key: vorsteuer_13b
    label: "Vorsteuerbeträge aus Leistungen nach § 13b — Steuer"
    export_column: "67"
    position: 140

  # --- Feeders: the tax ELSTER computes, which has no Kennzahl ---------------
  # No export_column, so they never appear on the return. Kz 83 needs them.
  - key: berechnete_steuer_19
    label: "Berechnete Steuer 19 % (kein Formularfeld)"
    position: 150
  - key: berechnete_steuer_7
    label: "Berechnete Steuer 7 % (kein Formularfeld)"
    position: 160
  - key: berechnete_steuer_ig_erwerb
    label: "Berechnete Steuer auf innergemeinschaftliche Erwerbe (kein Formularfeld)"
    position: 170

  # --- Ergebnis ---------------------------------------------------------------
  - key: sondervorauszahlung
    label: "Abzug der festgesetzten Sondervorauszahlung für Dauerfristverlängerung (in der Regel nur in der letzten Voranmeldung des Besteuerungszeitraums)"
    export_column: "39"
    position: 178
  - key: zahllast
    label: "Verbleibende Umsatzsteuer-Vorauszahlung"
    export_column: "83"
    includes: [ berechnete_steuer_19, berechnete_steuer_7, steuer_andere_saetze,
                berechnete_steuer_ig_erwerb, steuer_ig_erwerb_andere_saetze,
                steuer_13b, steuer_13b_andere ]
    subtracts: [ vorsteuer_rechnungen, vorsteuer_ig_erwerb,
                 einfuhrumsatzsteuer, vorsteuer_13b, sondervorauszahlung ]
    position: 180

