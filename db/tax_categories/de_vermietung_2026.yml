# What this scheme is CALLED, in the language of its own form — the name shown
# in the scheme picker and in every message about it. Never translated: an
# Anlage V is called Anlage V by everyone who fills one in.
scheme_label: "Vermietung und Verpachtung (Anlage V)"
report_name: "DE-Vermietung"
currency: EUR
# Anlage V — Einkünfte aus Vermietung/Verpachtung bebauter Grundstücke.
#
# Transcribed box by box from the Vordruck named in `source:` below — that block
# is the record of which edition, and its checksum. The BMF publishes each year's
# Vordruck in the August or September of that year, so the newest in existence is
# usually the previous calendar year's.
#
# export_column is the KENNZAHL — the small green number printed in the box.
# Kennzahlen are what ELSTER transmits and they survive from year to year; the
# Zeile numbers shift whenever the head of the form grows, so those live in
# notes, where being a year out is harmless.
#
# One key per box, deliberately. Where the form puts several kinds of cost in
# one box — Grundsteuer, Hausversicherung and Hausgeld are all "Umgelegte
# Kosten", Kennzahl 52 — that is ONE category with several accounts pointing at
# it, which is exactly what the mapping is for. Three keys would put the same
# box in the dropdown three times under three names.
#
# Not included: the multi-year distribution of Erhaltungsaufwendungen (Kz 38–42)
# and the special depreciation regimes (§ 7b, Kz 70; §§ 7h/7i, Kz 31). Those are
# carried-forward computations, not something you book to an account.
# Neither url nor index_url: the copy in docs/ came from Daniela, and the BMF's
# canonical address for it is not known. Only the local checksum is recorded, so
# nothing is watched automatically — see the README. Supply a url when one is
# found and the watch starts working with no other change.
# Provenance, and what TaxFormWatchJob watches monthly: it re-fetches
# `url`, compares the checksum, and looks on `index_url` for a later edition
# than `form_year`. A 404 is reported (the address moved); a timeout is not.
