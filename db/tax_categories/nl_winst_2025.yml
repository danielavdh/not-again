country_code: nl
scheme: winst
tax_year: 2025
authority: Belastingdienst
position: 10
# What this scheme is CALLED, in the language of its own form — the name shown
# in the scheme picker and in every message about it. Never translated.
scheme_label: "Winst uit onderneming"
report_name: "NL-winst"
currency: EUR
# tax_year_ends omitted: the Dutch tax year is the calendar year, which is the
# default. Only Britain declares one here.
#
# No connector. The btw-aangifte is the Dutch return that could one day be
# submitted from here — periodic, and nothing but the ledger summed — but the
# income tax return is annual and reconciling, so it stops at tagging and export.
# See "What tier 3 will never include" in the README.
#
# Winst uit onderneming — the profit section of the aangifte inkomstenbelasting,
# for an eenmanszaak or ZZP'er.
#
# ⚠️ THERE IS NO FORM. The Netherlands files online only, so nothing is printed
# with box numbers on it. The authoritative definition of the return is the XBRL
# taxonomy it is transmitted in, and that is what these categories are
# transcribed from — see docs/tax-forms/nl-winstaangifte-resultatenrekening-nt20.md,
# which lists every element in the taxonomy's own order with its own Dutch
# labels, and names the exact package and version it came from.
#
# So `export_column` holds the taxonomy's ELEMENT NAME rather than a box number.
# That is the authority's own identifier, which is what the field is for — and
# unlike Switzerland's OR article it would double as `api_field` if a Digipoort
# connector were ever built.
#
# `label` is the Belastingdienst's own Dutch wording, verbatim from the taxonomy.
#
# WHAT IS DELIBERATELY NOT HERE:
#   * the totals the return computes for itself — Totaal bedrijfsopbrengsten,
#     Totaal bedrijfslasten, Totaal financiële baten en lasten, Resultaat gewone
#     bedrijfsuitoefening, Saldo fiscale winstberekening. An account is never
#     tagged with a subtotal.
#   * the winstaandeel block (Aandeel belastingplichtige ondernemingswinst and
#     the samenwerkingsverband lines). Those allocate an already-computed profit
#     between partners; they are not things you book to an account.
#   * Willekeurige afschrijving op bedrijfsmiddel in Nederland, a repeating
#     specification block (bd-t_) of description/amount/book value rather than
#     one figure.
#   * Toelichting Resultatenrekening, which is free text.
#
# ON SECTIONS. `section` is the app's own vocabulary — income, expenses, other —
# and says only WHICH SUBTOTAL a figure joins. It does not carry direction: a
# credit to an expense account comes out negative and reduces the expense total,
# so the figures below that can go either way still behave correctly. That is why
# "Ontvangen uitkeringen en loonsubsidies" is an expense (the return treats it as
# reducing personnel costs, which is also how Dutch practice books it) and why
# the two waardeveranderingen need no fourth section value.
#
# ⚠️ The Netherlands has no cash-basis option for most businesses: the
# factuurstelsel is the default and the kasstelsel is allowed only where you sell
# almost entirely to private individuals. So a Dutch user is usually on an
# accrual basis, which the app supports with no setting — see the user guide.
categories:
  # ── Bedrijfsopbrengsten ────────────────────────────────────────────────
  - key: netto_omzet
    label: "Netto omzet fiscaal"
    export_column: "bd-i_TurnoverNetFiscal"
    section: income
    position: 10
    keywords: [omzet, verkopen, netto omzet, honorarium, opbrengsten]
  - key: wijziging_voorraad_onderhanden_werk
    label: "Wijziging voorraad en onderhanden werk fiscaal"
    export_column: "bd-i_StockAndWorkInProgressChangeFiscal"
