#
# datev_bu is the DATEV BU-Schlüssel the export sends instead of the VAT
# amount; DATEV works the VAT out from it. Set only where the key is beyond
# doubt — 2/3 (USt 7 %/19 %), 8/9 (VSt 7 %/19 %). The § 13b, Erwerb and 2020
